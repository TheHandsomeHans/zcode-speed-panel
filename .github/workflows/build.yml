name: Build & Release

# Triggered by pushing v*-en tags (English release tag format).
# Builds Windows (.exe) and macOS (.dmg, dual arch) in parallel,
# then publishes everything as a single GitHub Release.
on:
  push:
    tags: ["v*-en"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action auto-creates the release for v*-en tags.
      # For workflow_dispatch, it only produces artifacts (no release).
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "zcode-speed-panel __VERSION__ (English)"
          releaseDraft: false
          prerelease: false
          releaseBody: "English translation of upstream release.\n\n- Portable .exe: run without installation\n- NSIS installer: standard Windows installer\n\nSee release notes for upstream changes."
          args: --target x86_64-pc-windows-msvc

      # Portable exe: copy the bare binary and name it with version
      - name: Prepare portable exe
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp "src-tauri/target/x86_64-pc-windows-msvc/release/zcode-speed-panel.exe" \
             "zcode-speed-panel_${VERSION}_x64-portable.exe"
          echo "PORTABLE=zcode-speed-panel_${VERSION}_x64-portable.exe" >> "$GITHUB_ENV"

      # Tag builds: attach portable exe to the release (installer is uploaded by tauri-action)
      - name: Upload portable exe to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "${PORTABLE}" --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            ${{ env.PORTABLE }}
          if-no-files-found: error

  # macOS dual-arch DMGs (not universal):
  # x86_64 = Intel (min 10.15), aarch64 = Apple Silicon (min 11.0).
  # Not signed/notarized — README documents Gatekeeper bypass.
  build-macos:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            deployment_target: "10.15"
          - target: aarch64-apple-darwin
            deployment_target: "11.0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Same release flow as Windows: v*-en tag creates release, manual dispatch only artifacts.
      # LSMinimumSystemVersion only reads from config (not env vars),
      # so inject it via --config inline JSON.
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "zcode-speed-panel __VERSION__ (English)"
          releaseDraft: false
          prerelease: false
          releaseBody: "English translation of upstream release.\n\n- x64 .dmg: Intel Macs\n- aarch64 .dmg: Apple Silicon (macOS 11+)\n\nNot signed/notarized. First launch: right-click → Open, or run \`xattr -cr /Applications/zcode-speed-panel.app\` (see README)."
          args: --target ${{ matrix.target }} --bundles dmg --config '{"bundle":{"macOS":{"minimumSystemVersion":"${{ matrix.deployment_target }}"}}}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
